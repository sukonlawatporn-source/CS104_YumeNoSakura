<!DOCTYPE html>
<html>

<head>

<style>

body{
    background:#0d0d0d;
    color:#00ffff;
    font-family:Arial;
    padding:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#111;
}

th{
    background:#ff00ff;
    padding:15px;
}

td{
    padding:12px;
    text-align:center;
}

input{
    padding:10px;
    margin:5px;
    background:#111;
    border:1px solid #00ffff;
    color:white;
}

button{
    padding:10px;
    background:#ff00ff;
    color:white;
    border:none;
}

a{
    color:#00ffff;
    text-decoration:none;
}

</style>

</head>

<body>

<h1>🎮 CYBERPUNK GAMING CAFE</h1>

<a href="/games">🎮 Game Menu</a>

<br><br>

<form method="POST" action="/add_customer">

    <input type="text" name="name" placeholder="Name">

    <input type="text" name="phone" placeholder="Phone">

    <input type="email" name="email" placeholder="Email">

    <button type="submit">
        Add Customer
    </button>

</form>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Phone</th>
    <th>Email</th>
    <th>Edit</th>
    <th>Delete</th>
</tr>

{% for customer in customers %}

<tr>

<td>{{ customer[0] }}</td>
<td>{{ customer[1] }}</td>
<td>{{ customer[2] }}</td>
<td>{{ customer[3] }}</td>

<td>
    <a href="/edit_customer/{{ customer[0] }}">
        ✏ Edit
    </a>
</td>

<td>
    <a href="/delete_customer/{{ customer[0] }}">
        ❌ Delete
    </a>
</td>

</tr>

{% endfor %}

</table>

</body>
</html>

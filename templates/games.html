<!DOCTYPE html>
<html>

<head>

<style>

body{
    background:#0d0d0d;
    color:#00ffff;
    font-family:Arial;
    padding:30px;
}

.game-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.game-card{
    width:250px;
    background:#111;
    border:1px solid #00ffff;
    padding:15px;
}

.game-card img{
    width:100%;
    height:150px;
    object-fit:cover;
}

input{
    padding:10px;
    margin:5px;
    background:#111;
    border:1px solid #00ffff;
    color:white;
}

button{
    padding:10px;
    background:#ff00ff;
    color:white;
    border:none;
}

a{
    color:#ff00ff;
    text-decoration:none;
}

</style>

</head>

<body>

<h1>🎮 GAME MENU</h1>

<a href="/">🏠 Home</a>

<br><br>

<form method="POST" action="/add_game">

    <input type="text" name="game_name" placeholder="Game Name">

    <input type="text" name="type" placeholder="Type">

    <input type="text" name="size_gb" placeholder="Size GB">

    <input type="text" name="image" placeholder="Image URL">

    <button type="submit">
        Add Game
    </button>

</form>

<div class="game-container">

{% for game in games %}

<div class="game-card">

    <img src="{{ game[4] }}">

    <h2>{{ game[1] }}</h2>

    <p>🎯 {{ game[2] }}</p>

    <p>💾 {{ game[3] }} GB</p>

    <a href="/edit_game/{{ game[0] }}">
        ✏ Edit
    </a>

    <br><br>

    <a href="/delete_game/{{ game[0] }}">
        ❌ Delete
    </a>

</div>

{% endfor %}

</div>

</body>
</html>

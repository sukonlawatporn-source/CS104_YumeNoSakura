<!DOCTYPE html>
<html>

<head>

<style>

body{
    background:#0d0d0d;
    color:#00ffff;
    font-family:Arial;
    padding:30px;
}

.game-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.game-card{
    width:250px;
    background:#111;
    padding:15px;
    border:1px solid #00ffff;
}

.game-card img{
    width:100%;
    height:150px;
    object-fit:cover;
}

a{
    color:#ff00ff;
    text-decoration:none;
}

</style>

</head>

<body>

<h1>🎮 GAME MENU</h1>

<a href="/">🏠 Home</a>

<div class="game-container">

{% for game in games %}

<div class="game-card">

    <!-- ใส่ลิงก์รูปตรงนี้ -->
    <img src="PASTE_IMAGE_LINK_HERE">

    <h2>{{ game[1] }}</h2>

    <p>🎯 {{ game[2] }}</p>

    <p>💾 {{ game[3] }} GB</p>

    <a href="/edit_game/{{ game[0] }}">
        ✏ Edit
    </a>

    <br><br>

    <a href="/delete_game/{{ game[0] }}">
        ❌ Delete
    </a>

</div>

{% endfor %}

</div>

</body>
</html>
